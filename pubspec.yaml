name: phone_vitals
description: "BlackBox MD - a black box and a doctor for your phone. Sudden-failure forensics: flight recorder, case file, elimination tests, treatments and a repair passport."
publish_to: 'none'
version: 0.5.0+5
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^11.1.0
  battery_plus: ^6.0.3
  sensors_plus: ^6.0.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  crypto: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
